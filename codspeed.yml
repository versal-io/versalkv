      ./target/codspeed/valkey-benchmark -h 127.0.0.1 -p 16379
      --dbnum 2 --threads 2 --seed 42 -c 50 -n 500000 -r 10000 -d 1024 -P 1 -t get --csv
  - name: valkey-benchmark/GET/P16
    exec: >-
