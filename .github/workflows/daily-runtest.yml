name: Daily Tcl Regression

on:
  schedule:
    # Run daily at 21:00 Asia/Shanghai (13:00 UTC).
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: daily-runtest-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  tcl-build:
    name: Tcl Binary Build
    runs-on: self-hosted
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt

      - name: Build Tcl test binaries
        run: |
          cargo build --bins
          mkdir -p ci-artifacts
          tar -C target/debug -czf ci-artifacts/versal-debug-binaries.tar.gz \
            versal-server \
            versal-cli \
            versal-benchmark \
            versal-check-aof \
            versal-check-rdb \
            versal-sentinel

      - name: Upload Tcl test binaries
        uses: actions/upload-artifact@v4
        with:
          name: versal-debug-binaries
          path: ci-artifacts/versal-debug-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1

  runtest:
    name: Tcl Regression (runtest)
    runs-on: self-hosted
    needs: tcl-build
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates coreutils gh hostname openssl \
            procps psmisc tcl8.6 tcl-tls tclx
          sudo ln -sf /usr/bin/tclsh8.6 /usr/bin/tclsh

      - name: Download Tcl test binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ci-artifacts target/debug
          mkdir -p ci-artifacts target/debug
          for attempt in 1 2 3; do
            rm -f ci-artifacts/versal-debug-binaries.tar.gz
            if gh run download "$GITHUB_RUN_ID" \
              --name versal-debug-binaries \
              --dir ci-artifacts; then
              tar -xzf ci-artifacts/versal-debug-binaries.tar.gz -C target/debug
              chmod +x target/debug/versal-*
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run Tcl regression suite
        env:
          VERSAL_TCL_SKIP_BUILD: "1"
          VERSAL_TCL_DENY_SLOW: "1"
        run: |
          rm -rf thirdparty/valkey/tests/tmp/* || true
          ./runtest

  runtest-sentinel:
    name: Sentinel Tcl Regression
    runs-on: self-hosted
    needs: tcl-build
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates coreutils gh hostname openssl \
            procps psmisc tcl8.6 tcl-tls tclx
          sudo ln -sf /usr/bin/tclsh8.6 /usr/bin/tclsh

      - name: Download Tcl test binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ci-artifacts target/debug
          mkdir -p ci-artifacts target/debug
          for attempt in 1 2 3; do
            rm -f ci-artifacts/versal-debug-binaries.tar.gz
            if gh run download "$GITHUB_RUN_ID" \
              --name versal-debug-binaries \
              --dir ci-artifacts; then
              tar -xzf ci-artifacts/versal-debug-binaries.tar.gz -C target/debug
              chmod +x target/debug/versal-*
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run Sentinel regression suite
        env:
          VERSAL_TCL_SKIP_BUILD: "1"
        run: |
          make check-sentinel-tcl-support
          ./runtest-sentinel

  runtest-moduleapi:
    name: Module API Tcl Tests
    runs-on: self-hosted
    needs: tcl-build
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates coreutils gh hostname openssl \
            procps psmisc tcl8.6 tcl-tls tclx
          sudo ln -sf /usr/bin/tclsh8.6 /usr/bin/tclsh

      - name: Download Tcl test binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ci-artifacts target/debug
          mkdir -p ci-artifacts target/debug
          for attempt in 1 2 3; do
            rm -f ci-artifacts/versal-debug-binaries.tar.gz
            if gh run download "$GITHUB_RUN_ID" \
              --name versal-debug-binaries \
              --dir ci-artifacts; then
              tar -xzf ci-artifacts/versal-debug-binaries.tar.gz -C target/debug
              chmod +x target/debug/versal-*
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run Module API regression suite
        env:
          VERSAL_TCL_SKIP_BUILD: "1"
        run: |
          ./runtest-moduleapi
