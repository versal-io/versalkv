name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "docs/**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs/**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "1"

jobs:
  rust-check:
    name: Rust Check (fmt, clippy, build, unit, integration, property, static checks)
    runs-on: self-hosted
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Log runner resources
        run: |
          uname -a
          nproc
          free -h
          df -h
          ulimit -a

      - name: Install Node.js (for wasm-check)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nodejs

      - name: Format check
        run: make fmt

      - name: Wasm check
        run: |
          rustup target add wasm32-unknown-unknown
          make wasm-check

      - name: Clippy
        run: make clippy

      - name: Unit tests
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C opt-level=0 -C debuginfo=0"
        run: cargo test --lib -- --test-threads=2

      - name: Integration tests
        run: cargo test --test integration

      - name: Property tests
        run: make property

      - name: Architecture checks
        run: make check-architecture

      - name: FFI boundaries
        run: make ffi-boundaries

      - name: Unsafe safety
        run: make check-unsafe-safety

      - name: CI support wiring
        run: make check-ci-support

  tcl-build:
    name: Tcl Binary Build
    runs-on: self-hosted
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt

      - name: Build Tcl test binaries
        run: |
          cargo build --bins
          mkdir -p ci-artifacts
          tar -C target/debug -czf ci-artifacts/versal-debug-binaries.tar.gz \
            versal-server \
            versal-cli \
            versal-benchmark \
            versal-check-aof \
            versal-check-rdb \
            versal-sentinel

      - name: Upload Tcl test binaries
        uses: actions/upload-artifact@v4
        with:
          name: versal-debug-binaries
          path: ci-artifacts/versal-debug-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1

  runtest:
    name: Tcl Regression (runtest)
    runs-on: self-hosted
    needs: tcl-build
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates coreutils gh hostname openssl \
            procps psmisc tcl8.6 tcl-tls tclx
          sudo ln -sf /usr/bin/tclsh8.6 /usr/bin/tclsh

      - name: Download Tcl test binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ci-artifacts target/debug
          mkdir -p ci-artifacts target/debug
          for attempt in 1 2 3; do
            rm -f ci-artifacts/versal-debug-binaries.tar.gz
            if gh run download "$GITHUB_RUN_ID" \
              --name versal-debug-binaries \
              --dir ci-artifacts; then
              tar -xzf ci-artifacts/versal-debug-binaries.tar.gz -C target/debug
              chmod +x target/debug/versal-*
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run Tcl regression suite
        env:
          VERSAL_TCL_SKIP_BUILD: "1"
        run: |
          rm -rf thirdparty/valkey/tests/tmp/* || true
          ./runtest

  runtest-sentinel:
    name: Sentinel Tcl Regression
    runs-on: self-hosted
    needs: tcl-build
    continue-on-error: true
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates coreutils gh hostname openssl \
            procps psmisc tcl8.6 tcl-tls tclx
          sudo ln -sf /usr/bin/tclsh8.6 /usr/bin/tclsh

      - name: Download Tcl test binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ci-artifacts target/debug
          mkdir -p ci-artifacts target/debug
          for attempt in 1 2 3; do
            rm -f ci-artifacts/versal-debug-binaries.tar.gz
            if gh run download "$GITHUB_RUN_ID" \
              --name versal-debug-binaries \
              --dir ci-artifacts; then
              tar -xzf ci-artifacts/versal-debug-binaries.tar.gz -C target/debug
              chmod +x target/debug/versal-*
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run Sentinel regression suite
        env:
          VERSAL_TCL_SKIP_BUILD: "1"
        run: |
          make check-sentinel-tcl-support
          ./runtest-sentinel

  runtest-moduleapi:
    name: Module API Tcl Tests
    runs-on: self-hosted
    needs: tcl-build
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates coreutils gh hostname openssl \
            procps psmisc tcl8.6 tcl-tls tclx
          sudo ln -sf /usr/bin/tclsh8.6 /usr/bin/tclsh

      - name: Download Tcl test binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ci-artifacts target/debug
          mkdir -p ci-artifacts target/debug
          for attempt in 1 2 3; do
            rm -f ci-artifacts/versal-debug-binaries.tar.gz
            if gh run download "$GITHUB_RUN_ID" \
              --name versal-debug-binaries \
              --dir ci-artifacts; then
              tar -xzf ci-artifacts/versal-debug-binaries.tar.gz -C target/debug
              chmod +x target/debug/versal-*
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run Module API regression suite
        env:
          VERSAL_TCL_SKIP_BUILD: "1"
        run: |
          ./runtest-moduleapi

  daily-performance:
    name: Daily Performance Baseline
    runs-on: self-hosted
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt

      - name: Run startup regression gate
        run: make daily-performance BASELINE_MS=${BASELINE_MS:-100} CURRENT_MS=${CURRENT_MS:-100}

  weekly-soak:
    name: Weekly 72h Soak
    runs-on: self-hosted
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt

      - name: Dry-run soak plan
        run: python3 scripts/versal-util.py ci weekly-soak --dry-run --duration-seconds 259200 --interval-seconds 10800
